name: Release

# Publishes a GitHub release when a version tag is pushed. The jar is always
# built from the tagged commit, after the full test suite, and the release
# notes come from that version's section in CHANGELOG.md. See
# CONTRIBUTING.md, "Releases".

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check that pom.xml version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::pom.xml version is '$actual', but tag $GITHUB_REF_NAME expects '$expected'."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: .github/scripts/extract-release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md

      - name: Build and test
        run: mvn -B package

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" target/spring-config-guard.jar \
            --title "spring-config-guard $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease
