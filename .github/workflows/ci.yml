name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B package

  # The action in action.yml, run from this checkout. A local action has no release tag to take its
  # version from, so it runs a published release's jar: this checks the action's steps, not this
  # commit's rules.
  action:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: A clean project passes
        uses: ./
        with:
          path: demo-project-clean
          version: 1.19.0

      - name: A misconfigured project runs (fail-on NONE)
        uses: ./
        with:
          path: demo-project
          fail-on: NONE
          version: 1.19.0

      # Same download and inputs as the step above, which passed, so a failure here comes from the findings.
      - name: A misconfigured project fails
        id: misconfigured
        continue-on-error: true
        uses: ./
        with:
          path: demo-project
          version: 1.19.0

      - name: Check that it failed
        if: steps.misconfigured.outcome != 'failure'
        run: |
          echo "::error::the action passed on demo-project, which has HIGH findings"
          exit 1

  # The Marketplace action (rgiovann/spring-config-guard-action), which calls the action above at a
  # release's commit. It runs that repository's main, which can't have workflows of its own.
  marketplace-action:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: A clean project passes
        uses: rgiovann/spring-config-guard-action@main
        with:
          path: demo-project-clean

      - name: A misconfigured project runs (fail-on NONE)
        uses: rgiovann/spring-config-guard-action@main
        with:
          path: demo-project
          fail-on: NONE

      # Same download and inputs as the step above, which passed, so a failure here comes from the findings.
      - name: A misconfigured project fails
        id: misconfigured
        continue-on-error: true
        uses: rgiovann/spring-config-guard-action@main
        with:
          path: demo-project

      - name: Check that it failed
        if: steps.misconfigured.outcome != 'failure'
        run: |
          echo "::error::the Marketplace action passed on demo-project, which has HIGH findings"
          exit 1
