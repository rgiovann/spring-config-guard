# Clean counterpart of demo-project/properties-format-showcase/application-test.properties:
# same keys, correct values. Secrets are referenced via env placeholders (never hardcoded),
# which is why SCG006 still reports 2 INFO findings here -- static analysis can't verify a
# runtime-injected value, but INFO alone never fails the build (ExitCodeResolver ignores it).
spring.h2.console.enabled=false
spring.datasource.password=${DB_PASSWORD}
jhipster.security.authentication.jwt.base64-secret=${JWT_SECRET}
management.endpoints.web.exposure.include=health,info
