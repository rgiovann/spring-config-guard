# SCG006 (HardcodedSecretsRule) configuration.
#
# All keys and patterns below are matched using RelaxedProperties.canonicalize()
# (strips '-'/'_', lowercases), so "spring.datasource.password", "spring-datasource-password"
# and "SPRING_DATASOURCE_PASSWORD" are all treated as the same key.

# Exact-match allowlist of well-known, native Spring Boot / infrastructure property keys.
# A property whose canonicalized key equals one of these entries is reported with the
# "core Spring Boot property" message wording, and — unlike secret-key-patterns below —
# is also the ONLY list that triggers an INFO finding (CWE-258: Empty Password in
# Configuration File) when its value is blank or null. secret-key-patterns matches are
# deliberately silent on blank values to avoid noise across dev/test/scaffolding files
# that legitimately leave non-native properties empty.
# Every entry is a current (non-deprecated) property in Spring Boot 4.1.1's configuration
# metadata, except the last one, an entry of the spring.kafka.properties map.
high-risk-keys:
  - spring.datasource.password
  - spring.r2dbc.password
  - spring.flyway.password
  - spring.liquibase.password
  - spring.sql.init.password
  - spring.data.redis.password
  - spring.data.redis.sentinel.password
  - spring.rabbitmq.password
  - spring.activemq.password
  - spring.artemis.password
  - spring.mail.password
  - spring.security.user.password
  - spring.neo4j.authentication.password
  - spring.mongodb.password
  - spring.cassandra.password
  - spring.couchbase.password
  - spring.elasticsearch.password
  - spring.elasticsearch.api-key
  - spring.ldap.password
  - spring.ldap.embedded.credential.password
  - server.ssl.key-store-password
  - server.ssl.key-password
  - server.ssl.trust-store-password
  - spring.kafka.ssl.key-store-password
  - spring.kafka.ssl.key-password
  - spring.kafka.ssl.trust-store-password
  - spring.kafka.properties.ssl.keystore.password

# Patterns for custom/third-party property keys that aren't in high-risk-keys but name a
# secret (e.g. "app.jwt.token", "payment.gateway.secret"). A property matches if its
# canonicalized key ENDS with one of these entries (also canonicalized), so the key names the
# secret itself, and is reported as HIGH with the "custom key pattern" message wording. A
# pattern elsewhere in the key (a namespace like "spring.cloud.kubernetes.secrets.namespace", a
# nested object like "...authorizationserver.client.<id>.token.access-token-time-to-live", or
# "app.secret-key-base", which may well be a secret) is reported as INFO instead: static
# analysis can't tell which it is. Keep entries specific/compound
# (e.g. "signing-key", not bare "key") — a bare "key" would match "...cache.key" or
# "...routing-key". Plurals are listed only where needed: "credentials" is a native key ending
# ("api-key-credentials"), while a plural "tokens" would match "max-tokens: 4000".
# See HardcodedSecretsRule's class Javadoc for what ending-only matching misses.
secret-key-patterns:
  - password
  - secret
  - private-key
  - api-key
  - token
  - credential
  - access-key
  - signing-key
  - encryption-key
  - master-key
  - auth-key
  - secret-key
  - credentials

# Value-level allowlist: if a sensitive property's value (raw, or after resolving a
# ${VAR:default} placeholder) starts with one of these prefixes, it is skipped entirely.
# Two distinct rationales share this one list:
#   - "{cipher}", "{vault}", "ENC(": the value already went through a proper
#     encryption/secret-reference mechanism, not hardcoded in plaintext. "{cipher}" and
#     "{vault}" are Spring Cloud Config's own conventions for an encrypted value and a
#     Vault-backed reference, respectively. "ENC(" is Jasypt's convention (the most common
#     third-party property-encryption library for Spring Boot outside the Spring Cloud
#     Config ecosystem) for a value encrypted with EncryptablePropertyResolver.
#   - "classpath:", "classpath*:", "file:": the value is a reference to WHERE secret
#     material lives (a PEM/keystore/certificate file on the classpath or filesystem), not
#     the secret material itself -- confirmed via a real-world corpus run (session
#     2026-09-16) against spring-projects/spring-boot's own smoke tests: SAML's
#     "private-key-location"/"certificate-location" and the PEM SSL bundle's bare
#     "private-key" property both conventionally hold a "classpath:..." path, and were
#     false-positiving as if that path string were the secret. Deliberately does NOT
#     include "http://"/"https://": unlike a classpath/file reference, a URL CAN be the
#     secret itself (e.g. a Slack/Discord webhook URL) -- see HardcodedSecretsRule's class
#     Javadoc for the related, deliberately-unaddressed limitation.
# Entries must not contain "${" — that syntax is reserved for EnvironmentPlaceholder
# resolution, not this allowlist.
ignored-value-prefixes:
  - "{cipher}"
  - "{vault}"
  - "ENC("
  - "classpath:"
  - "classpath*:"
  - "file:"

# Key-suffix allowlist: even when a key matches one of the secret-key-patterns above, the
# finding is suppressed if the canonicalized key ends with one of these suffixes -- Spring's
# own naming convention for "this property is a network location/endpoint", not a value that
# could itself hold a secret. Confirmed via the same corpus run: "token-uri",
# "token-revocation-uri", and "token-introspection-uri" (OAuth2 Authorization Server endpoint
# paths, from spring-projects/spring-boot's own oauth2-authorization-server smoke test) all
# matched the "token" pattern above despite holding a URI path, not a token value.
#
# Known, deliberately accepted limitation: a property whose key ends in one of these
# suffixes AND whose value is itself a secret (e.g. a Slack/Discord webhook URL, which
# embeds its credential as a path segment, not a query param or userinfo) is also silenced
# by this list. Detecting a secret by entropy inside a URL path segment is the job of a
# generic secret scanner (GitLeaks, TruffleHog), not this tool's declared scope (Spring Boot
# property-key semantics) -- see HardcodedSecretsRule's class Javadoc.
ignored-key-suffixes:
  - uri
  - url
  - endpoint

# Key-prefix allowlist: a property equal to one of these keys, or under it on a "." boundary,
# is skipped before any other check. Their last segment is a logger, group or package name
# chosen by the application, which can end in a pattern above
# ("logging.level.org.springframework.security.oauth2.server.authorization.token: DEBUG"), and
# their value is a log level or a list of logger names, never a secret.
ignored-key-prefixes:
  - logging.level
  - logging.group
