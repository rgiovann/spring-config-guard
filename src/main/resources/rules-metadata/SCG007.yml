# SCG007 (EmbeddedConnectionCredentialsRule) configuration.
#
# SCG007 finds an embedded credential by the shape of a value, in every property (see
# EmbeddedCredentials): a password in a URL's user-info, a password= URL parameter, Oracle's
# user/password@host, or a password/clientSecret option in a JAAS configuration. No key list
# decides what is inspected.
#
# connection-keys lists the native connection properties, canonicalized
# (RelaxedProperties.canonicalize()), for which a value that can't be verified statically -- an
# unresolved placeholder (${DB_URL}) or an empty default (${DB_URL:}) -- is reported as INFO: the
# URL or JAAS configuration injected at runtime may carry a credential. Current names in Spring
# Boot 4.1.1's configuration metadata, plus the deprecated names still used by Spring Boot 2/3
# projects (spring.redis.url, spring.data.mongodb.uri), the Kafka sasl.jaas.config map entries and
# the Spring Cloud Stream Kafka binders' (ADR-009).
connection-keys:
  - "spring.datasource.url"
  - "spring.datasource.hikari.jdbc-url"
  - "spring.datasource.dbcp2.url"
  - "spring.datasource.tomcat.url"
  - "spring.r2dbc.url"
  - "spring.flyway.url"
  - "spring.liquibase.url"
  - "spring.mongodb.uri"
  - "spring.data.mongodb.uri"
  - "spring.data.redis.url"
  - "spring.redis.url"
  - "spring.elasticsearch.uris"
  - "spring.rabbitmq.addresses"
  - "spring.activemq.broker-url"
  - "spring.artemis.broker-url"
  - "spring.couchbase.connection-string"
  - "spring.neo4j.uri"
  - "spring.ldap.urls"
  - "spring.pulsar.client.service-url"
  - "spring.pulsar.admin.service-url"
  - "spring.kafka.properties.sasl.jaas.config"
  - "spring.kafka.producer.properties.sasl.jaas.config"
  - "spring.kafka.consumer.properties.sasl.jaas.config"
  - "spring.kafka.admin.properties.sasl.jaas.config"
  - "spring.kafka.streams.properties.sasl.jaas.config"
  - "spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config"
  - "spring.cloud.stream.kafka.binder.consumer-properties.sasl.jaas.config"
  - "spring.cloud.stream.kafka.binder.producer-properties.sasl.jaas.config"
  - "spring.cloud.stream.kafka.streams.binder.configuration.sasl.jaas.config"
  - "spring.cloud.stream.kafka.streams.binder.consumer-properties.sasl.jaas.config"
  - "spring.cloud.stream.kafka.streams.binder.producer-properties.sasl.jaas.config"
