# SCG012 (InsecureDatabaseTransportRule) configuration.
#
# Three mechanisms, kept as separate groups because they're different vulnerability classes
# (or different evidence shapes) with different messages, not just a flat "risky value" list:
#   - risky-query-params:    TLS/SSL disabled or downgradable to cleartext (CWE-319),
#                              expressed as a query-string parameter (JDBC/Mongo/Redis style).
#   - no-verify-query-params: TLS is used, but certificate/hostname validation is explicitly
#                              disabled -- traffic is encrypted but a forged/self-signed
#                              certificate lets an attacker MITM anyway (CWE-295).
#   - risky-schemes:          TLS disabled or absent, expressed as the URI's own scheme
#                              (Elasticsearch/RabbitMQ/ActiveMQ/LDAP style) rather than a query
#                              parameter -- confirmed (session 2026-09-14) that none of these
#                              tools express TLS via query string the way JDBC drivers do, so
#                              listing them under uri-based alone left them as dead entries that
#                              could never match risky-query-params/no-verify-query-params.
# sslmode=prefer is deliberately NOT listed as risky: it's pgjdbc's own default when the
# property is absent entirely (confirmed in the official pgjdbc docs), so flagging it would
# punish writing the default explicitly rather than detecting an actual downgrade.

# Keys whose value is a connection URI checked for an insecure scheme (risky-schemes), and for
# which an unresolved placeholder is reported as INFO. The query parameter mechanisms below don't
# depend on this list: they apply to any property whose value starts with jdbc:, r2dbc:,
# mongodb: or mongodb+srv: (see InsecureDatabaseTransportRule). Current names in Spring Boot
# 4.1.1's configuration metadata, plus the deprecated ones still used by Spring Boot 2/3 projects
# (spring.data.mongodb.uri, spring.redis.url). redis:// is not a risky scheme: Spring Boot
# enables TLS when spring.data.redis.ssl.enabled is true even with a redis:// URL (its Lettuce
# and Jedis configurations check the property or a rediss:// URL).
uri-based:
  - "spring.datasource.url"
  - "spring.datasource.hikari.jdbc-url"
  - "spring.datasource.dbcp2.url"
  - "spring.datasource.tomcat.url"
  - "spring.r2dbc.url"
  - "spring.flyway.url"
  - "spring.liquibase.url"
  - "spring.mongodb.uri"
  - "spring.data.mongodb.uri"
  - "spring.data.redis.url"
  - "spring.redis.url"
  - "spring.elasticsearch.uris"
  - "spring.rabbitmq.addresses"
  - "spring.activemq.broker-url"
  - "spring.ldap.urls"
  - "spring.cloud.config.uri"
  # Spring Cloud AWS (session 2026-09-15): "spring.cloud.aws.endpoint" overrides every
  # auto-configured AWS client at once; secretsmanager/parameterstore carry real bootstrap
  # secrets, same risk class as Vault (SCG016) and Config Server above. Confirmed spelling is
  # "parameterstore" (Spring Cloud AWS 3.x/4.x), not the old 2.x "paramstore" prefix -- and not
  # to be confused with the unrelated "spring.cloud.config.server.awsparamstore.endpoint"
  # (a different component: Spring Cloud Config Server's own AWS Parameter Store backend).
  - "spring.cloud.aws.endpoint"
  - "spring.cloud.aws.secretsmanager.endpoint"
  - "spring.cloud.aws.parameterstore.endpoint"
  # Same Spring Cloud AWS 3.x module family, confirmed against each module's own
  # *Properties.java (session 2026-09-16): S3/SQS/SNS/DynamoDB/SES all extend the shared
  # AwsClientProperties base (which declares "endpoint"), under their own prefix. Unlike the
  # bootstrap-secret keys above, these carry business payload (queue/topic messages, table
  # items, objects, outbound mail) rather than credentials -- still CWE-319 in HTTP, just a
  # different impact class. No "rds.endpoint" here: Spring Cloud AWS has no such property --
  # RDS access goes through the regular "spring.datasource.url" (JDBC), already covered above.
  - "spring.cloud.aws.s3.endpoint"
  - "spring.cloud.aws.sqs.endpoint"
  - "spring.cloud.aws.sns.endpoint"
  - "spring.cloud.aws.dynamodb.endpoint"
  - "spring.cloud.aws.ses.endpoint"

# Parameter=value pairs (lowercased) meaning TLS/SSL is disabled or may be silently
# downgraded to cleartext (CWE-319).
risky-query-params:
  - "usessl=false"
  - "requiressl=false"
  - "ssl=false"
  - "tls=false"
  - "sslmode=disable"
  - "sslmode=disabled"
  - "sslmode=allow"
  # MariaDB Connector/J 3.5 reads sslMode=false and sslMode=0 as DISABLE (SslMode.from)
  - "sslmode=false"
  - "sslmode=0"
  # mssql-jdbc 13.4: encrypt=no and encrypt=optional both map to EncryptOption.FALSE
  - "encrypt=false"
  - "encrypt=no"
  - "encrypt=optional"

# Parameter=value pairs (lowercased) meaning TLS is used but certificate/hostname validation
# is explicitly turned off (CWE-295) -- encrypted, but trivially MITM-able with a forged cert.
# NOTE polarity: trustServerCertificate is the one entry here where the risky value is "true",
# not "false" like everywhere else in this file -- SQL Server's flag means "trust the server's
# certificate without verifying it" when set to true, the opposite naming convention from
# MySQL's verifyServerCertificate.
#
# Also the modes that encrypt without checking the certificate, confirmed in each driver (in the
# versions Spring Boot 4.1.1 manages): pgjdbc's sslmode=require (SslMode.verifyCertificate() is
# false; only verify-ca/verify-full verify), MySQL Connector/J's sslMode=REQUIRED (only
# VERIFY_CA/VERIFY_IDENTITY verify), MariaDB's sslMode=trust. Reported as MEDIUM: the traffic is
# encrypted, and reading it takes an active man in the middle.
no-verify-query-params:
  - "sslmode=require"
  - "sslmode=required"
  - "sslmode=trust"
  - "verifyservercertificate=false"
  - "trustservercertificate=true"
  - "tlsinsecure=true"
  - "tlsallowinvalidcertificates=true"
  - "tlsallowinvalidhostnames=true"
  - "verifypeer=none"

# URI scheme prefixes (lowercase, matched against the start of the value) meaning the
# connection itself is unencrypted -- no secure counterpart needs to be listed: "https://"
# does not start with "http://" (5th character diverges, 's' vs ':'), same for
# "amqps://"/"ldaps://" against their insecure prefixes, so a plain prefix match already
# discriminates correctly. "tcp://" has no such prefix relationship with ActiveMQ's "ssl://"
# transport -- it's a different word entirely, not a longer/shorter variant of it.
risky-schemes:
  - "http://"
  - "amqp://"
  - "tcp://"
  - "ldap://"
