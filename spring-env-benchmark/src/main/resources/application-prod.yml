app:
  scalar-property: "prod-override-value" # 1. Simple scalar override
  list-property:
    - "prod-single-item" # 2. List redefinition (must replace the base's entire list)
  relaxedBindingTest: "camel-override" # 3. Relaxed binding (camelCase overriding kebab-case)
  nullable-override: null # 4. Override to an explicit null
  file-vs-on-profile-conflict: "from-named-file" # 7. same key as the on-profile block in application.yml -- which one wins?
  bracket-map:
    "[com.other]": "prod-warn" # 8. new entry: must not wipe out the base's entries
    "[override.me]": "from-prod" # 9. overrides only this entry
    "[com.foobar]": "no-dash-from-prod" # 11. Spring keeps it separate from [com.foo-bar]; SCG merges the two
    "[props.bracketed]": "from-prod-yml" # 13. overrides the bracketed entry from application.properties
  lists:
    profile-yaml-empty: [] # 19. explicit empty list over the base's non-empty one
    profile-yaml-null: # 38. a YAML null over the base's non-empty list
    profile-comma-over-indexed: "x,y" # 21. comma-separated over the base's indexed list
  object-lists:
    partial-override:
      - port: 9 # 23. the only field the profile sets
    quoted-index:
      "[0]":
        url: "https://prod.internal" # 26. index 0 written as a quoted key instead of a list item
  shapes:
    scalar-then-map:
      key: "from-prod" # 29.
    map-then-scalar: "plain" # 30.
    scalar-then-map-as-string:
      key: "from-prod" # 31.
    map-then-scalar-as-string: "plain" # 32.
    scalar-then-object:
      url: "https://prod.internal" # 33.
    object-then-scalar: "plain" # 34.
    null-over-map: # 36.
    null-over-object: # 37.
