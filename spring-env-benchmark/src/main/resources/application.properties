spring.application.name=spring-env-benchmark
# 10. same key as "[security.protocol]" in application.yml, written with dots: .properties wins
app.bracket-map.security.protocol=SASL_SSL
# 13. bracketed key in .properties, overridden by application-prod.yml
app.bracket-map[props.bracketed]=from-properties
# 15. comma-separated here, indexed in application.yml: .properties wins
app.lists.props-comma=health,info
# 16. indexed here, comma-separated in application.yml: .properties wins
app.lists.props-indexed[0]=x
# 17. spaces after the commas
app.lists.spaced=x, y ,z
# 18. empty string here, a non-empty list in application.yml
app.lists.props-empty=
