server:
  port: 8081 # Different port so it doesn't conflict with anything

management:
  endpoints:
    web:
      exposure:
        include: env,configprops # /actuator/env (raw sources) and /actuator/configprops (bound values)
  endpoint:
    env:
      show-values: ALWAYS # CRITICAL: shows the real values of passwords/secrets instead of masking them with '******'
    configprops:
      show-values: ALWAYS # same, for the map bound in BenchmarkProperties

# --- TEST CASES / FIXTURES (BASE) ---
app:
  scalar-property: "base-value"
  list-property:
    - "base-item-1"
    - "base-item-2"
  relaxed-binding-test: "kebab-from-base"
  nullable-override: "should-be-nullified-in-profile"
  base-null: # 4b. A null in the base file, overridden by no profile
  base-tilde: ~ # 4b. The same, written as ~
  placeholder-with-default: "${UNSET_ENV_VAR:default-from-base}"
  yml-vs-yaml: "from-yml" # 35. application.yaml defines the same key: .yml wins
  # --- Bracketed map keys (ADR-007), read via /actuator/configprops ---
  bracket-map:
    "[com.acme-core]": "base-debug" # 8. merged key by key: survives the profile
    "[org.example]": "base-info" # 8. same
    "[override.me]": "from-base" # 9. the profile overrides only this entry
    "[security.protocol]": "PLAINTEXT" # 10. application.properties defines the same key with dots and wins
    "[com.foo-bar]": "dash-from-base" # 11. accepted collision: the profile defines [com.foobar]
    plain.dotted: "nested-dotted" # 12. dotted key without brackets (as in spring-cloud-stream-samples)
  # --- The same list written in different formats, read via /actuator/configprops ---
  lists:
    props-comma: ["*"] # 15. application.properties sets it comma-separated and wins
    props-indexed: "y,z" # 16. application.properties sets it indexed and wins
    props-empty: ["a", "b"] # 18. application.properties sets it to an empty string
    profile-yaml-empty: ["a", "b"] # 19. application-prod.yml overrides it with []
    profile-props-empty: ["a", "b"] # 20. application-prod.properties overrides it with an empty string
    profile-comma-over-indexed: ["a", "b", "c"] # 21. application-prod.yml overrides it comma-separated
    profile-omits-key: ["a", "b"] # 22. control: no profile file mentions it
  # --- Lists of objects partially overridden by a profile, read via /actuator/configprops ---
  object-lists:
    partial-override: # 23. application-prod.yml sets only [0].port
      - url: "https://a.internal"
        port: 1
        password: "base-secret-a"
      - url: "https://b.internal"
        port: 2
        password: "base-secret-b"
    properties-partial-override: # 24. application-prod.properties sets only [0].port
      - url: "https://a.internal"
        port: 1
      - url: "https://b.internal"
        port: 2
    same-directory-override: # 25. application.properties sets only [0].url
      - url: "https://a.internal"
        port: 1
      - url: "https://b.internal"
        port: 2
    quoted-index: # 26. application-prod.yml writes the index as a quoted "[0]" key
      - url: "https://a.internal"
        port: 1
      - url: "https://b.internal"
        port: 2
    omits-key: # 27. control: no other file mentions it
      - url: "https://a.internal"
        port: 1
  # --- A scalar and a map on the same key, base vs. profile, read via /actuator/configprops ---
  shapes:
    scalar-then-map: "plain" # 29. Map target; the profile sets scalar-then-map.key
    map-then-scalar: # 30. Map target; the profile sets map-then-scalar as a scalar
      key: "from-base"
    scalar-then-map-as-string: "plain" # 31. String target; the profile sets .key
    map-then-scalar-as-string: # 32. String target; the profile sets it as a scalar
      key: "from-base"
    scalar-then-object: "plain" # 33. object target; the profile sets .url
    object-then-scalar: # 34. object target; the profile sets it as a scalar
      url: "https://a.internal"

# --- Internal on-profile block coexisting with application-prod.yml, both for
# the "prod" profile: both contribute and the named file wins a key conflict
# (case 6 of ActuatorEnvComparisonTest; VALIDATION.md, benchmark) ---
---
spring:
  config:
    activate:
      on-profile: prod
app:
  on-profile-only-property: "from-internal-on-profile" # 6. only exists here -- do the two coexist?
  file-vs-on-profile-conflict: "from-internal-on-profile" # 7. same key that application-prod.yml defines -- which one wins?
  bracket-map:
    "[from.on-profile]": "on-profile-entry" # 14. bracketed entry coming only from the on-profile block