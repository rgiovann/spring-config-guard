server:
  port: 8081 # Different port so it doesn't conflict with anything

management:
  endpoints:
    web:
      exposure:
        include: env,configprops # /actuator/env (raw sources) and /actuator/configprops (bound values)
  endpoint:
    env:
      show-values: ALWAYS # CRITICAL: shows the real values of passwords/secrets instead of masking them with '******'
    configprops:
      show-values: ALWAYS # same, for the map bound in BenchmarkProperties

# --- TEST CASES / FIXTURES (BASE) ---
app:
  scalar-property: "base-value"
  list-property:
    - "base-item-1"
    - "base-item-2"
  relaxed-binding-test: "kebab-from-base"
  nullable-override: "should-be-nullified-in-profile"
  placeholder-with-default: "${UNSET_ENV_VAR:default-from-base}"
  # --- Bracketed map keys (ADR-007), read via /actuator/configprops ---
  bracket-map:
    "[com.acme-core]": "base-debug" # 8. merged key by key: survives the profile
    "[org.example]": "base-info" # 8. same
    "[override.me]": "from-base" # 9. the profile overrides only this entry
    "[security.protocol]": "PLAINTEXT" # 10. application.properties defines the same key with dots and wins
    "[com.foo-bar]": "dash-from-base" # 11. accepted collision: the profile defines [com.foobar]
    plain.dotted: "nested-dotted" # 12. dotted key without brackets (as in spring-cloud-stream-samples)

# --- Internal on-profile block coexisting with application-prod.yml, both for
# the "prod" profile: both contribute and the named file wins a key conflict
# (case 6 of ActuatorEnvComparisonTest; VALIDATION.md, benchmark) ---
---
spring:
  config:
    activate:
      on-profile: prod
app:
  on-profile-only-property: "from-internal-on-profile" # 6. only exists here -- do the two coexist?
  file-vs-on-profile-conflict: "from-internal-on-profile" # 7. same key that application-prod.yml defines -- which one wins?
  bracket-map:
    "[from.on-profile]": "on-profile-entry" # 14. bracketed entry coming only from the on-profile block